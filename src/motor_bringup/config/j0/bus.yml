options:
  dcf_path: "@BUS_CONFIG_PATH@"

master:
  node_id: 1
  driver: "ros2_canopen::MasterDriver"
  package: "canopen_master_driver"
  sync_period: 10000

nodes:
  joint0:
    # CAN node ID configured on the Everest EVS-XCR-C via Ingenia's MotionLab3.
    # Default factory setting is typically 32 (0x20) — change to match your drive.
    node_id: 32
    dcf: "eve-xcr-c_2.8.1.eds"
    driver: "ros2_canopen::Cia402Driver"
    package: "canopen_402_driver"
    period: 10
    revision_number: 0

    sdo:

      # Interpolation time for cyclic sync position mode: 10 ms
      - {index: 0x60C2, sub_index: 1, value: 10}
      - {index: 0x60C2, sub_index: 2, value: -3}
      
      # Profile velocity / accel / decel (in drive units — tune for your rail)
      - {index: 0x6081, sub_index: 0, value: 100000}
      - {index: 0x6083, sub_index: 0, value: 50000}
      - {index: 0x6084, sub_index: 0, value: 50000}
      - {index: 0x6085, sub_index: 0, value: 50000}
      - {index: 0x6086, sub_index: 0, value: 0}  # trapezoidal profile

    tpdo:
      1:
        enabled: true
        cob_id: "auto"
        transmission: 0x01
        mapping:
          - {index: 0x6041, sub_index: 0}  # statusword
          - {index: 0x6061, sub_index: 0}  # mode of operation display

      2:
        enabled: true
        cob_id: "auto"
        transmission: 0x01
        mapping:
          - {index: 0x6064, sub_index: 0}  # position actual value
          - {index: 0x606C, sub_index: 0}  # velocity actual value

      3:
        enabled: false

      4:
        enabled: false

    rpdo:

      1:
        enabled: true
        cob_id: "auto"
        mapping:
          - {index: 0x6040, sub_index: 0}  # controlword
          - {index: 0x6060, sub_index: 0}  # mode of operation

      2:
        enabled: true
        cob_id: "auto"
        mapping:
          - {index: 0x607A, sub_index: 0}  # target position
          - {index: 0x60FF, sub_index: 0}  # target velocity
